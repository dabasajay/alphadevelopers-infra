---
- name: Datastore host for the alphadevelopers POC platform
  hosts: all
  become: true
  roles:
    - base
    - ssh-hardening
    - crowdsec
    - docker
    - pki
    - postgres
    - pgbouncer
    - redis
    - pgbackrest
    # After pgbackrest: it resolves the AWS credentials this role publishes with.
    - cloudwatch-metrics
    - app-credentials
    - secrets-backup
