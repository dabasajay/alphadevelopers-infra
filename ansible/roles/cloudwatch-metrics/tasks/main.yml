---
- name: Install unzip for the AWS CLI bundle
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Check whether the AWS CLI is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: aws_cli

# No apt candidate on Noble, so the vendored installer it is.
- name: Install the AWS CLI
  when: not aws_cli.stat.exists
  block:
    - name: Fetch the AWS CLI installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"

    - name: Unpack the AWS CLI installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true

    - name: Run the AWS CLI installer
      ansible.builtin.command:
        cmd: /tmp/aws/install
        creates: /usr/local/bin/aws

    - name: Remove the installer
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/awscliv2.zip
        - /tmp/aws

- name: Create the monitoring directory
  ansible.builtin.file:
    path: "{{ cw_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the metric publisher credentials
  ansible.builtin.template:
    src: aws.env.j2
    dest: "{{ cw_dir }}/aws.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the metric publisher
  ansible.builtin.template:
    src: metrics.sh.j2
    dest: "{{ cw_script }}"
    owner: root
    group: root
    mode: "0700"

- name: Publish the metrics hourly
  ansible.builtin.cron:
    name: cloudwatch metrics
    minute: "5"
    job: "{{ cw_script }} >> /var/log/alphadevelopers-metrics.log 2>&1"
