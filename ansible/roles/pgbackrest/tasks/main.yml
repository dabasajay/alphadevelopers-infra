---
# Read straight from the Terraform state so the key is never copied by hand.
- name: Read the backup credentials from the Terraform outputs
  ansible.builtin.command:
    cmd: tofu -chdir={{ playbook_dir }}/../terraform/envs/prod output -json
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  register: tf_outputs
  when: backup_secret_access_key | length == 0
  no_log: true

- name: Take the backup credentials from the Terraform outputs
  ansible.builtin.set_fact:
    backup_access_key_id: "{{ (tf_outputs.stdout | from_json).backup_iam_access_key_id.value }}"
    backup_secret_access_key: "{{ (tf_outputs.stdout | from_json).backup_iam_secret_access_key.value }}"
  when:
    - backup_secret_access_key | length == 0
    - tf_outputs.rc | default(1) == 0
  no_log: true

- name: Require the backup credentials
  ansible.builtin.assert:
    that: backup_secret_access_key | length > 0
    fail_msg: >-
      Terraform outputs unreadable and no credentials supplied. Pass them with
      -e backup_access_key_id=... -e backup_secret_access_key=...

# Parameter Store is the source of truth. Generating a new passphrase makes
# every existing backup unreadable, so this must never fall back silently on a
# host that already has a repository.
- name: Ensure the handoff directory exists
  ansible.builtin.file:
    path: "{{ secrets_out_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Read the repository passphrase from Parameter Store
  ansible.builtin.command:
    cmd: >-
      aws ssm get-parameter --name {{ ssm_backup_prefix }}/pgbackrest-cipher
      --with-decryption --region {{ backup_region }}
      --query Parameter.Value --output text
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: ssm_cipher
  changed_when: false
  failed_when: false
  no_log: true

- name: Use the stored repository passphrase
  ansible.builtin.set_fact:
    backup_cipher_pass: "{{ ssm_cipher.stdout | trim }}"
  when: ssm_cipher.rc == 0 and (ssm_cipher.stdout | trim | length) > 0
  no_log: true

- name: Generate a repository passphrase on first provision
  ansible.builtin.set_fact:
    backup_cipher_pass: "{{ lookup('password', secrets_out_dir + '/pgbackrest-cipher.txt length=64 chars=ascii_letters,digits') }}"
  when: backup_cipher_pass is not defined
  no_log: true

# Refuse rather than silently re-encrypt: a mismatched passphrase would leave
# the existing backups unreadable and the next one unverifiable.
- name: Confirm the passphrase matches the existing repository
  ansible.builtin.assert:
    that: backup_cipher_pass | length > 0
    fail_msg: >-
      No repository passphrase in {{ ssm_backup_prefix }}/pgbackrest-cipher and
      none generated. Restore it before running again.

# An output, not an input: the run above already decided the value. Written so
# the operator has a local copy and so secrets-backup can mirror it.
- name: Write the repository passphrase locally
  ansible.builtin.copy:
    content: "{{ backup_cipher_pass }}\n"
    dest: "{{ secrets_out_dir }}/pgbackrest-cipher.txt"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Render the pgBackRest configuration
  ansible.builtin.template:
    src: pgbackrest.conf.j2
    dest: /etc/alphadevelopers/pgbackrest/pgbackrest.conf
    owner: "999"
    group: "999"
    mode: "0640"
  no_log: true

# pgBackRest is baked into the image, so archive_command keeps working across
# container recreation rather than until the next Ansible run.
- name: Verify pgBackRest is present in the container
  ansible.builtin.command:
    cmd: docker exec -u postgres postgres pgbackrest version
  register: pgbr_version
  changed_when: false

- name: Create the stanza
  ansible.builtin.command:
    cmd: docker exec -u postgres postgres pgbackrest --stanza=main stanza-create
  register: stanza
  # pgbackrest reports this on stdout and still exits 0.
  changed_when: "'already exists' not in stanza.stdout"

- name: Schedule a weekly full and a daily incremental
  ansible.builtin.cron:
    name: "pgbackrest {{ item.type }}"
    weekday: "{{ item.weekday }}"
    hour: "2"
    minute: "{{ item.minute }}"
    job: "docker exec -u postgres postgres pgbackrest --stanza=main --type={{ item.type }} backup >> /var/log/pgbackrest/cron.log 2>&1"
  loop:
    - { type: full, weekday: "0", minute: "0" }
    - { type: incr, weekday: "1-6", minute: "30" }
