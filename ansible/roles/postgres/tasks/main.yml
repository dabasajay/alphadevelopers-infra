---
- name: Create the local secrets directory
  ansible.builtin.file:
    path: "{{ secrets_out_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Create Postgres directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "999"
    group: "999"
  loop:
    - /var/lib/alphadevelopers/postgres
    - /etc/alphadevelopers/postgres
    - /etc/alphadevelopers/pgbackrest
    - /var/lib/alphadevelopers/pgbackrest
    - /var/log/alphadevelopers/pgbackrest

- name: Stage the server key material for the container
  ansible.builtin.copy:
    src: "{{ pki_dir }}/{{ item }}"
    dest: /etc/alphadevelopers/postgres/{{ item | basename }}
    remote_src: true
    owner: "999"
    group: "999"
    mode: "0600"
  loop:
    - server.crt
    - server.key
    - client-ca.crt

- name: Render the Postgres configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/alphadevelopers/postgres/{{ item }}
    owner: "999"
    group: "999"
    mode: "0600"
  loop:
    - postgresql.conf
    - pg_hba.conf
  register: pg_config

- name: Stage the image build context
  ansible.builtin.template:
    src: Dockerfile.j2
    dest: /etc/alphadevelopers/postgres/Dockerfile
    mode: "0644"
  register: pg_dockerfile

# community.docker 4+ moved building out of docker_image into this module.
- name: Build the Postgres image with pgBackRest
  community.docker.docker_image_build:
    name: alphadevelopers/postgres
    tag: "{{ pg_version }}"
    path: /etc/alphadevelopers/postgres
    pull: true
    rebuild: "{{ 'always' if pg_dockerfile.changed else 'never' }}"

# The running container is the source of truth. Regenerating this would change
# the container spec and force a needless recreate; the value itself is never
# needed by a human, since pg_hba trusts the local socket.
- name: Read the superuser password off the running container
  ansible.builtin.command:
    cmd: docker inspect -f '{{ "{{range .Config.Env}}{{println .}}{{end}}" }}' postgres
  register: pg_container_env
  changed_when: false
  failed_when: false
  no_log: true

- name: Reuse the superuser password the container already has
  ansible.builtin.set_fact:
    pg_superuser_password: "{{ pg_container_env.stdout | regex_search('POSTGRES_PASSWORD=(.+)', '\\1') | first }}"
  when: pg_container_env.rc == 0 and 'POSTGRES_PASSWORD=' in pg_container_env.stdout
  no_log: true

# Only reached on a host with no postgres container, i.e. first provision.
- name: Generate a superuser password for a new cluster
  ansible.builtin.set_fact:
    pg_superuser_password: "{{ lookup('password', '/dev/null length=40 chars=ascii_letters,digits') }}"
  when: pg_superuser_password is not defined
  no_log: true

# No published ports: reachable only from this bridge, or by docker exec.
- name: Run the Postgres container
  community.docker.docker_container:
    name: postgres
    image: "alphadevelopers/postgres:{{ pg_version }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: alphadevelopers
    env:
      POSTGRES_PASSWORD: "{{ pg_superuser_password }}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /var/lib/alphadevelopers/postgres:/var/lib/postgresql/data
      - /etc/alphadevelopers/postgres:/certs:ro
      - /etc/alphadevelopers/pgbackrest:/etc/pgbackrest:ro
      - /var/lib/alphadevelopers/pgbackrest:/var/lib/pgbackrest
      - /var/log/alphadevelopers/pgbackrest:/var/log/pgbackrest
    command:
      - postgres
      - -c
      - config_file=/certs/postgresql.conf
      - -c
      - hba_file=/certs/pg_hba.conf
    comparisons:
      env: strict
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 6

# docker_container will not notice a changed bind-mounted config file.
- name: Restart Postgres when its configuration changed
  ansible.builtin.command:
    cmd: docker restart postgres
  when: pg_config.changed
  changed_when: true

- name: Wait for Postgres to accept connections
  ansible.builtin.command:
    cmd: docker exec postgres pg_isready -U postgres
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

# pgbackrest holds its control connection idle from pg_backup_start until every
# file is copied, so any idle_session_timeout aborts the backup. Exempt the role
# it connects as rather than weakening the setting for the app roles.
- name: Read the superuser role settings
  ansible.builtin.command:
    cmd: >-
      docker exec postgres psql -U postgres -tAc
      "SELECT coalesce(array_to_string(rolconfig, ','), '') FROM pg_roles WHERE rolname = 'postgres'"
  register: pg_superuser_config
  changed_when: false

- name: Exempt the superuser from the idle session timeout
  ansible.builtin.command:
    cmd: >-
      docker exec postgres psql -U postgres -tAc
      "ALTER ROLE postgres SET idle_session_timeout = 0"
  when: "'idle_session_timeout=0' not in pg_superuser_config.stdout"
  changed_when: true

- name: Resolve each app's database password
  ansible.builtin.include_tasks: password.yml
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"

- name: Provision each app's role and database
  ansible.builtin.include_tasks: app.yml
  loop: "{{ apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
