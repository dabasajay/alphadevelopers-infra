---
# The Lambda environment is the only place this password survives, so it is the
# source of truth. Reading it back is what makes out/ disposable.
- name: "{{ app.name }}: read the Lambda environment"
  ansible.builtin.command:
    cmd: >-
      aws lambda get-function-configuration
      --function-name {{ app.lambda_function }}
      --region {{ backup_region }}
      --query Environment.Variables.DATABASE_URL
      --output text
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
  delegate_to: localhost
  become: false
  register: app_db_url
  changed_when: false
  failed_when: false
  no_log: true

- name: "{{ app.name }}: reuse the deployed database password"
  ansible.builtin.set_fact:
    app_passwords: "{{ app_passwords | default({}) | combine({
        app.name: app_db_url.stdout | regex_search('://[^:]+:([^@]+)@', '\\1') | first | urldecode }) }}"
  when: app_db_url.rc == 0 and '://' in app_db_url.stdout
  no_log: true

- name: "{{ app.name }}: generate a database password on first provision"
  ansible.builtin.set_fact:
    app_passwords: "{{ app_passwords | default({}) | combine({
        app.name: lookup('password', '/dev/null length=40 chars=ascii_letters,digits') }) }}"
  when: app.name not in (app_passwords | default({}))
  no_log: true
