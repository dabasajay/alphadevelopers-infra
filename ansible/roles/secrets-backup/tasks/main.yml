---
# An explicit list, not a directory scan: only these two exist nowhere else.
# Every other generated value is also in the Lambda environment, and the app
# role passwords can be reset with the superuser anyway.

# Parameter Store rather than Secrets Manager: same KMS encryption, but the
# Standard tier is free where Secrets Manager is $0.40 per secret per month.
# Values are passed as file:// so they never appear in the process list.
- name: Back up each secret to Parameter Store
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      name="{{ ssm_backup_prefix }}/{{ item | regex_replace('\.[^.]+$', '') }}"
      current=$(aws ssm get-parameter --name "$name" --with-decryption \
        --region {{ backup_region }} --query Parameter.Value --output text 2>/dev/null || true)
      if [ "$(printf '%s' "$current")" = "$(cat '{{ secrets_out_dir }}/{{ item }}')" ]; then
        echo UNCHANGED
        exit 0
      fi
      aws ssm put-parameter --name "$name" --type SecureString --overwrite \
        --region {{ backup_region }} --value "file://{{ secrets_out_dir }}/{{ item }}" \
        --description "Generated by ansible; the only other copy is out/ on the operator machine" \
        > /dev/null
      echo UPDATED
  environment:
    AWS_PROFILE: "{{ aws_profile }}"
  delegate_to: localhost
  become: false
  run_once: true
  loop: "{{ ssm_backup_files }}"
  loop_control:
    label: "{{ item }}"
  register: ssm_backup
  changed_when: "'UPDATED' in ssm_backup.stdout"
