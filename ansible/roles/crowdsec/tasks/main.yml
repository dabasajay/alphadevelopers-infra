---
- name: Add CrowdSec repository
  ansible.builtin.shell:
    cmd: curl -sS https://install.crowdsec.net | sh
    creates: /etc/apt/sources.list.d/crowdsec_crowdsec.list

- name: Install CrowdSec and the firewall bouncer
  ansible.builtin.apt:
    name:
      - crowdsec
      - crowdsec-firewall-bouncer-iptables
    state: present
    update_cache: true

# The bouncer ships with INPUT only. Traffic to a published container port is
# DNAT'd and traverses FORWARD, so bans never reached pgbouncer or redis.
# DOCKER-USER is the chain docker guarantees is consulted before its own rules.
- name: Have the bouncer filter container traffic too
  ansible.builtin.replace:
    path: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    regexp: '^iptables_chains:\n  - INPUT\n#  - FORWARD\n#  - DOCKER-USER$'
    replace: "iptables_chains:\n  - INPUT\n  - FORWARD\n  - DOCKER-USER"
  register: cs_bouncer_chains

- name: Enable CrowdSec
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - crowdsec
    - crowdsec-firewall-bouncer

- name: Restart the bouncer when its chains changed
  ansible.builtin.service:
    name: crowdsec-firewall-bouncer
    state: restarted
  when: cs_bouncer_chains.changed
