---
# One entry per POC app. Adding an app here provisions its database, role,
# client certificate and Redis container on the next run.
apps:
  - name: resume-builder
    pg_database: resume_db
    pg_role: resume_app
    redis_port: 24320
    # Caps concurrent backends so one app cannot starve the others.
    pg_connection_limit: 20
    pgbouncer_pool_size: 20
    redis_maxmemory: 256mb
    redis_maxclients: 100
    # Read-only web console, published on loopback and reached over an SSM
    # tunnel. Its own role and its own tiny connection budget, so a developer
    # running a slow query cannot eat into the app's pool.
    pg_console_role: resume_debug
    console_port: 8081
    console_connection_limit: 3
    # Used only to render the Lambda environment file.
    domain: easyjd.com
    pdf_bucket: alphadevelopers-prod-resume-builder-pdfs
    # Read back to recover secrets that exist nowhere else, so out/ stays
    # disposable and a fresh clone converges without changing anything.
    lambda_function: alphadevelopers-prod-resume-builder-api

pgbouncer_port: 24312

# Both are in the server certificate SAN; libpq only gained iPAddress matching
# in PostgreSQL 16, so the DNS name is what clients should use.
vm_hostname: srv1136595.hstgr.cloud
vm_public_ip: 72.61.224.144

# SSH is already restricted to this address by the Hostinger panel firewall.
admin_ip: 89.117.176.127

pg_version: "18.6"
pgbouncer_image: edoburu/pgbouncer:latest
redis_version: "8.10.1"
pgweb_image: sosedoff/pgweb:0.17.0

# Created by terraform in services/shared. The agent assumes it once registered.
ssm_hybrid_role: alphadevelopers-prod-ssm-hybrid

# ECDSA P-256: an RSA-2048 cert, key and CA chain together exceed Lambda's 4KB
# environment variable budget. P-256 is ~1.5KB for all three.
pki_key_type: ECC
pki_curve: secp256r1
pki_dir: /etc/alphadevelopers/pki
pki_server_ca_days: 1825
# Matched to the CAs on purpose. The client cert lives in the Lambda env, so
# renewing it means rewriting that env; a yearly expiry would be a yearly
# outage risk for no real gain. The expiry alarm gives 30 days' notice.
pki_client_cert_days: 1825
# Re-signed automatically once it is this close to expiry; the CloudWatch alarm
# fires at 30 days so you hear about it before that happens.
pki_client_cert_renew_days: 60
pki_renew_client_certs: false

aws_profile: alphadevelopers
backup_bucket: alphadevelopers-prod-db-backups
backup_region: ap-south-1
backup_retention_full: 3

# Mirrored to Parameter Store so this machine is not the only copy.
ssm_backup_prefix: /alphadevelopers/prod/ansible

# Written locally for you to paste into the Lambda console; never committed.
secrets_out_dir: "{{ playbook_dir }}/out"
